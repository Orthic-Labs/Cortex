name: Cortex qualification

on:
  push:
  pull_request:

jobs:
  qualify:
    env:
      NODE_NO_WARNINGS: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install -r requirements-test.txt
      - run: pnpm test:all
      - run: node evals/context-baselines.mjs
